<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E" />
    <title>Biocaps</title>
    <style>
      /* Aviso sin JavaScript: React lo reemplaza al montar. Si la app no arranca
         (p. ej. abierta con doble clic, por file://), aparece a los 3 s en lugar de una pantalla en blanco. */
      .sin-arranque {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 16px;
        padding: 48px;
        background: #fff;
        color: #505050;
        font: 600 28px/1.3 system-ui, sans-serif;
        text-align: center;
        opacity: 0;
        animation: aparecer 0.3s 3s forwards;
      }
      .sin-arranque strong {
        font-size: 40px;
      }
      @keyframes aparecer {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="sin-arranque">
        <strong>La pantalla no pudo arrancar</strong>
        <span>Ábrela con Biocaps.exe o con iniciar-respaldo.bat.<br />Nunca con doble clic sobre index.html.</span>
      </div>
    </div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
